<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA - Brand News Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6 md:p-12">

  <header class="max-w-6xl mx-auto mb-10 border-b border-slate-800 pb-6">
    <h1 class="text-3xl font-bold tracking-tight bg-gradient-to-r from-blue-400 to-teal-400 bg-clip-text text-transparent">
      AURA Brand News Tracker
    </h1>
    <p class="text-slate-400 mt-2 text-sm">
      全ブランドの公式プレスリリースおよび一次情報をリアルタイム参照
    </p>
  </header>

  <main class="max-w-6xl mx-auto">
    <div id="loading" class="text-center text-slate-400 py-12">データを読み込み中...</div>
    <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden"></div>
  </main>

  <script>
    const SUPABASE_URL = 'https://wimjkvkprixuumnuabjd.supabase.co';
    const SUPABASE_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndpbWprdmtwcml4dXVtbnVhYmpkIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4ODc5NTI4NSwiZXhwIjoyMTA0MzcxMjg1fQ.5TcA2jjunBmi45tJL9IO8oYMnIM68fqFMBlgO5U1WtA';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function fetchProducts() {
      const loadingEl = document.getElementById('loading');
      const gridEl = document.getElementById('product-grid');

      try {
        const { data, error } = await supabaseClient
          .from('products')
          .select('*')
          .limit(100);

        if (error) {
          console.error('Supabase Error:', error);
          loadingEl.innerHTML = `<span class="text-red-400 font-bold">【Supabaseエラー】<br>${error.message || JSON.stringify(error)}</span>`;
          return;
        }

        if (!data || data.length === 0) {
          loadingEl.innerText = 'データが0件です。DBにレコードが存在するか確認してください。';
          return;
        }

        loadingEl.classList.add('hidden');
        gridEl.classList.remove('hidden');

        gridEl.innerHTML = data.map(item => `
          <div class="bg-slate-800/80 border border-slate-700/60 rounded-xl p-5 hover:border-blue-500 transition-all flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between mb-3">
                <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20">
                  ${item.brand || 'Brand'}
                </span>
                <span class="text-xs text-slate-400">${item.release_date || 'NEW'}</span>
              </div>
              <h2 class="font-medium text-base text-slate-100 line-clamp-2 mb-4">
                ${item.product_name || '名称未設定'}
              </h2>
            </div>
            <a href="${item.source_url}" target="_blank" rel="noopener noreferrer" style="display: block; text-align: center; padding: 8px 16px; background-color: #2563eb; color: white; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 500;">
              公式ソースを開く ↗
            </a>
          </div>
        `).join('');
      } catch (err) {
        console.error('System Error:', err);
        loadingEl.innerHTML = `<span class="text-red-400 font-bold">【通信エラー】<br>${err.message}</span>`;
      }
    }

    fetchProducts();
  </script>
</body>
</html>
