<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA FASHION - 新作服カタログ</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0d0f17; color: #f3f4f6; font-family: sans-serif; padding: 20px; }
        header { max-width: 1200px; margin: 0 auto 30px; border-bottom: 1px solid #1f2937; padding-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 24px; letter-spacing: 2px; }
        .grid { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .card { background-color: #161b26; border: 1px solid #232d3f; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
        .img-wrap { width: 100%; height: 280px; background-color: #05070a; position: relative; }
        .img-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .badge { position: absolute; top: 10px; left: 10px; background: rgba(0, 0, 0, 0.75); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 11px; }
        .info { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
        .brand { font-size: 12px; color: #60a5fa; font-weight: bold; margin-bottom: 4px; }
        .title { font-size: 14px; color: #e5e7eb; line-height: 1.4; margin-bottom: 12px; height: 38px; overflow: hidden; }
        .price { font-size: 16px; font-weight: bold; color: #ffffff; margin-top: auto; }
        .btn { display: block; margin-top: 12px; text-align: center; background-color: #2563eb; color: #fff; text-decoration: none; padding: 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        #loading { text-align: center; padding: 100px 0; color: #9ca3af; font-size: 18px; }
    </style>
</head>
<body>
    <header>
        <h1>AURA FASHION <span style="font-size:12px; color:#3b82f6;">NEW ARRIVALS</span></h1>
        <div id="count" style="color:#9ca3af;">読み込み中...</div>
    </header>

    <div id="loading">ブランド公式ストアの新作データを読み込み中...</div>
    <div class="grid" id="product-grid" style="display:none;"></div>

    <script>
        const SUPABASE_URL = "https://wimjkvkprixuumnuabjd.supabase.co";
        const SUPABASE_KEY = "sb_publishable_lS7N-qJOa6davBdF219uHg_x7fjrbZU";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function fetchProducts() {
            const grid = document.getElementById('product-grid');
            const loading = document.getElementById('loading');
            const count = document.getElementById('count');

            try {
                let { data, error } = await supabase.from('products').select('*').order('created_at', { ascending: false });

                loading.style.display = 'none';
                grid.style.display = 'grid';

                if (!data || data.length === 0) {
                    loading.style.display = 'block';
                    loading.innerHTML = '現在データがありません。<br>スクレイパーを実行してください。';
                    count.innerText = '0 件';
                    return;
                }

                count.innerText = `全 ${data.length} 件の新作服`;
                grid.innerHTML = '';

                data.forEach(item => {
                    const priceFormatted = item.price ? `¥${Number(item.price).toLocaleString()}` : '価格未定';
                    const imgUrl = item.image_url || 'https://via.placeholder.com/300x400?text=NO+IMAGE';

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="img-wrap">
                            <img src="${imgUrl}" alt="${item.product_name}">
                            <div class="badge">NEW</div>
                        </div>
                        <div class="info">
                            <div class="brand">${item.brand || 'BRAND'}</div>
                            <div class="title">${item.product_name || '新作アイテム'}</div>
                            <div class="price">${priceFormatted}</div>
                            <a href="${item.source_url}" target="_blank" rel="noopener" class="btn">公式ストアを見る</a>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error(err);
                loading.innerText = '通信エラーが発生しました。';
            }
        }

        fetchProducts();
    </script>
</body>
</html>
