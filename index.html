<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA FASHION - 新作服ノミネートカタログ</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0d0f17;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
        }
        header {
            max-width: 1200px;
            margin: 0 auto 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            letter-spacing: 2px;
            color: #ffffff;
        }
        .stats {
            font-size: 14px;
            color: #9ca3af;
        }
        .grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: #161b26;
            border: 1px solid #232d3f;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: #3b82f6;
        }
        .img-wrap {
            width: 100%;
            height: 280px;
            background-color: #05070a;
            position: relative;
        }
        .img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .brand {
            font-size: 12px;
            color: #60a5fa;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .title {
            font-size: 14px;
            color: #e5e7eb;
            line-height: 1.4;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 38px;
        }
        .price {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            margin-top: auto;
        }
        .btn {
            display: block;
            margin-top: 12px;
            text-align: center;
            background-color: #2563eb;
            color: #fff;
            text-decoration: none;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        .btn:hover { background-color: #1d4ed8; }
        #loading {
            text-align: center;
            padding: 100px 0;
            color: #9ca3af;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <header>
        <h1>AURA FASHION <span style="font-size:12px; color:#3b82f6; font-weight:normal;">NEW ARRIVALS</span></h1>
        <div class="stats" id="count">読み込み中...</div>
    </header>

    <div id="loading">ブランド公式サイトから新作アイテムを取得中...</div>
    <div class="grid" id="product-grid" style="display:none;"></div>

    <script>
        const SUPABASE_URL = "https://wimjkvkprixuumnuabjd.supabase.co";
        const SUPABASE_KEY = "sb_publishable_lS7N-qJOa6davBdF219uHg_x7fjrbZU";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function fetchProducts() {
            try {
                const { data, error } = await supabase
                    .from('products')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                const grid = document.getElementById('product-grid');
                const loading = document.getElementById('loading');
                const count = document.getElementById('count');

                loading.style.display = 'none';
                grid.style.display = 'grid';

                if (!data || data.length === 0) {
                    loading.style.display = 'block';
                    loading.innerText = '現在登録されている新作アイテムがありません。スクレイパーを実行してください。';
                    count.innerText = '0件の新作';
                    return;
                }

                count.innerText = `全 ${data.length} 件の新作服を掲載中`;
                grid.innerHTML = '';

                data.forEach(item => {
                    const priceFormatted = item.price ? `¥${Number(item.price).toLocaleString()}` : '価格情報なし';
                    const imgUrl = item.image_url || 'https://via.placeholder.com/300x400?text=NO+IMAGE';

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="img-wrap">
                            <img src="${imgUrl}" alt="${item.product_name}" onerror="this.src='https://via.placeholder.com/300x400?text=IMAGE+ERROR'">
                            <div class="badge">NEW</div>
                        </div>
                        <div class="info">
                            <div class="brand">${item.brand || 'BRAND'}</div>
                            <div class="title">${item.product_name || '名称未設定'}</div>
                            <div class="price">${priceFormatted}</div>
                            <a href="${item.source_url}" target="_blank" rel="noopener" class="btn">公式ストアで見る</a>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error(err);
                document.getElementById('loading').innerText = 'データの取得に失敗しました。';
            }
        }

        fetchProducts();
    </script>
</body>
</html>
