<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA FASHION - 新作コレクション</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0d0f17; color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; }
        header { max-width: 1200px; margin: 0 auto 30px; border-bottom: 1px solid #1f2937; padding-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 22px; letter-spacing: 2px; }
        .grid { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .card { background-color: #161b26; border: 1px solid #232d3f; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s; }
        .card:hover { transform: translateY(-4px); }
        .img-wrap { width: 100%; height: 280px; background-color: #090c12; position: relative; }
        .img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .badge { position: absolute; top: 10px; left: 10px; background: rgba(0, 0, 0, 0.85); color: #fff; padding: 3px 7px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .info { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
        .brand { font-size: 11px; color: #60a5fa; font-weight: bold; text-transform: uppercase; margin-bottom: 4px; }
        .title { font-size: 13px; color: #e5e7eb; line-height: 1.4; margin-bottom: 12px; height: 36px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .price { font-size: 17px; font-weight: bold; color: #10b981; margin-top: auto; }
        .btn { display: block; margin-top: 12px; text-align: center; background-color: #2563eb; color: #fff; text-decoration: none; padding: 9px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .btn:hover { background-color: #1d4ed8; }
        #loading { text-align: center; padding: 100px 0; color: #9ca3af; font-size: 16px; }
    </style>
</head>
<body>
    <header>
        <h1>AURA FASHION</h1>
        <div id="count" style="color:#9ca3af; font-size: 13px;">読み込み中...</div>
    </header>

    <div id="loading">公式ストアから最新データを読み込んでいます...</div>
    <div class="grid" id="product-grid" style="display:none;"></div>

    <script>
        const SUPABASE_URL = "https://wimjkvkprixuumnuabjd.supabase.co";
        const SUPABASE_KEY = "sb_publishable_lS7N-qJOa6davBdF219uHg_x7fjrbZU";

        async function loadProducts() {
            const grid = document.getElementById('product-grid');
            const loading = document.getElementById('loading');
            const count = document.getElementById('count');

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/products?select=*&order=created_at.desc`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });

                const data = await res.json();
                loading.style.display = 'none';
                grid.style.display = 'grid';

                if (!Array.isArray(data) || data.length === 0) {
                    loading.style.display = 'block';
                    loading.innerText = 'データがありません。スクレイパーを実行してください。';
                    count.innerText = '0 件';
                    return;
                }

                count.innerText = `全 ${data.length} 件の新作服`;
                grid.innerHTML = '';

                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="img-wrap">
                            <img src="${item.image_url}" alt="${item.product_name}">
                            <div class="badge">OFFICIAL</div>
                        </div>
                        <div class="info">
                            <div class="brand">${item.brand || 'BRAND'}</div>
                            <div class="title">${item.product_name}</div>
                            <div class="price">¥${Number(item.price).toLocaleString()}</div>
                            <a href="${item.source_url}" target="_blank" rel="noopener" class="btn">公式ストアで購入 ↗</a>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error(err);
                loading.innerText = 'データの読み込みに失敗しました。';
            }
        }

        loadProducts();
    </script>
</body>
</html>
